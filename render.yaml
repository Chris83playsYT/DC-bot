services:
  - type: web
    name: weird-guy-discord-bot
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node bot/start.js
    envVars:
      - key: PORT
        value: 10000
      - key: TOKEN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: AI_INTEGRATIONS_OPENROUTER_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENROUTER_BASE_URL
        sync: false
